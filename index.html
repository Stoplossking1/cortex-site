<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex — Votre ligne répond après la fermeture</title>
<meta name="description" content="Cortex répond aux appels de votre entreprise de location après la fermeture, en français d'ici, et livre le dossier complet avant l'ouverture.">
<style>
  :root{
    --bg:#F6F5F2; --card:#FFFFFF; --ink:#1B1D20; --muted:#6B6F76;
    --amber:#C9781F; --amber-dark:#A96114; --steel:#14161A; --steel-ink:#F2F0EC;
    --line:#E4E1DB; --green:#2E7D4F; --radius:12px;
    --shadow:0 1px 2px rgba(20,22,26,.05),0 8px 24px rgba(20,22,26,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  h1,h2,h3{font-weight:800;letter-spacing:-0.02em;line-height:1.15}
  h2.sec{font-size:clamp(1.7rem,3.4vw,2.5rem);text-align:center;max-width:26ch;margin:0 auto}
  .sec-sub{color:var(--muted);text-align:center;max-width:52ch;margin:16px auto 0;font-size:1.05rem}
  section{padding:96px 0}
  .btn{display:inline-block;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:1rem;padding:15px 32px;border-radius:10px;text-decoration:none;text-align:center}
  .btn-primary{background:var(--amber);color:#fff}
  .btn-primary:hover{background:var(--amber-dark)}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:#fff}

  /* nav */
  nav{position:sticky;top:0;z-index:20;background:rgba(246,245,242,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .logo{font-weight:800;font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase}
  .logo span{color:var(--amber)}
  .nav-links{display:flex;gap:28px;font-size:.95rem}
  .nav-links a{color:var(--muted);text-decoration:none}
  .nav-links a:hover{color:var(--ink)}
  .nav-right{display:flex;align-items:center;gap:14px}
  .nav-cta{padding:10px 20px;font-size:.9rem}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang-toggle button{background:none;border:none;color:var(--muted);padding:6px 12px;font:inherit;font-size:.8rem;cursor:pointer}
  .lang-toggle button.active{color:#fff;background:var(--ink)}
  @media(max-width:820px){.nav-links{display:none}}

  /* hero */
  .hero{padding:88px 0 96px}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
  .hero h1{font-size:clamp(2.3rem,5vw,3.6rem)}
  .hero .sub{color:var(--muted);font-size:1.15rem;max-width:50ch;margin:22px 0 34px}
  .hero-ctas{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .hero-phone{font-weight:700;color:var(--ink)}
  .stats{display:flex;gap:0;margin-top:46px;border-top:1px solid var(--line);padding-top:26px}
  .stat{flex:1}
  .stat b{display:block;font-size:1.25rem;letter-spacing:-.01em}
  .stat span{color:var(--muted);font-size:.85rem}
  @media(max-width:900px){.hero-grid{grid-template-columns:1fr}.stats{flex-direction:column;gap:18px}}

  /* call mockup */
  .mock{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .mock-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .mock-head b{font-size:.95rem}
  .mock-head span{color:var(--muted);font-size:.8rem;margin-left:auto}
  .convo{padding:20px;display:flex;flex-direction:column;gap:12px}
  .bubble{max-width:85%;padding:10px 14px;border-radius:12px;font-size:.88rem;line-height:1.45}
  .bubble.caller{background:var(--bg);border:1px solid var(--line);align-self:flex-start}
  .bubble.ai{background:var(--steel);color:var(--steel-ink);align-self:flex-end}
  .bubble .who{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:3px}

  /* onboarding strip */
  .strip{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .strip-in{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:72px 0}
  .strip h2{font-size:clamp(1.5rem,3vw,2.1rem)}
  .strip p{color:var(--muted);margin:16px 0 26px}
  .keepnum{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
  .keepnum b{display:block;font-size:1.05rem;margin-bottom:8px}
  .keepnum p{color:var(--muted);font-size:.92rem;margin:0}
  .keepnum .tag{display:inline-block;background:#E8F3EC;color:var(--green);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:14px}
  @media(max-width:900px){.strip-in{grid-template-columns:1fr}}

  /* features 3-col */
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
  .feat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:18px}
  .feat h3{font-size:1.1rem}
  .feat>p{color:var(--muted);font-size:.92rem}
  .mini{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:16px;font-size:.8rem;margin-top:auto}
  .mini .mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .mini .mrow:last-child{border-bottom:none}
  .mini .k{color:var(--muted)}
  .mini .ok{color:var(--green);font-weight:700}
  .sms{background:var(--steel);color:var(--steel-ink);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:.8rem;line-height:1.5}
  .sms small{opacity:.55;display:block;margin-top:8px}
  @media(max-width:900px){.feat-grid{grid-template-columns:1fr}}

  /* listen / demo */
  .listen{background:var(--steel);color:var(--steel-ink)}
  .listen h2{color:var(--steel-ink)}
  .listen .sec-sub{color:#A7A49C}
  .listen-cta{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:40px}
  .listen .phone-big{font-size:1.3rem;font-weight:800;letter-spacing:.02em}
  .listen .note{text-align:center;color:#A7A49C;font-size:.85rem;margin-top:18px}

  /* never (guardrails) */
  .never-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:820px;margin:48px auto 0}
  .never-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:20px 22px;font-weight:600}
  .never-close{text-align:center;color:var(--muted);margin-top:36px}
  @media(max-width:700px){.never-grid{grid-template-columns:1fr}}

  /* industries */
  .ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
  .ind{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .ind .ico{font-size:1.6rem}
  .ind h3{font-size:1.05rem;margin:12px 0 8px}
  .ind p{color:var(--muted);font-size:.9rem}
  @media(max-width:900px){.ind-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.ind-grid{grid-template-columns:1fr}}

  /* cta */
  .cta{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
  .cta .bullets{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:34px;color:var(--muted);font-size:.9rem}
  .cta .bullets span::before{content:"✓ ";color:var(--green);font-weight:700}
  .cta .btn{margin-top:38px}

  /* faq */
  .faq{max-width:760px;margin:48px auto 0}
  details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:0 22px}
  summary{cursor:pointer;font-weight:700;padding:18px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::after{content:"+";font-weight:400;font-size:1.3rem;color:var(--muted)}
  details[open] summary::after{content:"–"}
  details p{color:var(--muted);padding-bottom:18px;font-size:.95rem}

  footer{padding:48px 0;color:var(--muted);font-size:.85rem}
  .foot-in{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
  .foot-in a{color:var(--muted)}

  .fade{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .fade.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}}
  @media(max-width:700px){section{padding:72px 0}}
</style>
</head>

function setLang(l){
  document.documentElement.lang=l;
  localStorage.setItem("cortex-lang",l);
  document.getElementById("btn-fr").classList.toggle("active",l==="fr");
  document.getElementById("btn-en").classList.toggle("active",l==="en");
  document.querySelectorAll("[data-i]").forEach(el=>{const s=STR[l][el.dataset.i];if(s!==undefined)el.innerHTML=s;});
  document.title=l==="fr"?"Cortex — Votre ligne répond après la fermeture":"Cortex — Your line answers after closing";
}
